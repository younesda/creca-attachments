kind = "web"
previewPath = "/"
title = "Cockpit — La plateforme des entrepreneurs"
version = "1.0.0"
id = "artifacts/cockpit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22274
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cockpit run dev"

[services.env]
PORT = "22274"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cockpit", "run", "build"]
publicDir = "artifacts/cockpit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
